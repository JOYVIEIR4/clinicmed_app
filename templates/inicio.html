{% extends 'layout.html' %}

{% block content %}
<style>
  .login-page {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px 20px;
  }

  .login-card {
    width: 360px;
    background: #8191a631;
    border-radius: 20px;
    box-shadow: 10px 10px 20px rgba(0, 0, 0, 0.425);
    padding: 25px;
    border: 1px solid #e6e9ee;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .brand h1 {
    font-size: 20px;
    margin: 0;
    color: #3a5161c2;
  }

  .login-card label {
    font-size: 13px;
    color: #333;
    display: block;
    margin: 10px 0 6px;
  }

  .login-card input[type="text"],
  .login-card input[type="password"] {
    width: 100%;
    padding: 10px 5px;
    border-radius: 8px;
    border: 1px solid #d7dade;
    outline: none;
    font-size: 14px;
    margin: 0 auto;
    text-align: left;
  }

  .login-card .actions {
    margin-top: 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .btn {
    padding: 9px 14px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-weight: 600;
  }

  .btn-secondary {
    background: transparent;
    color: #0b5ed7;
    border: 1px solid #d7dade;
  }

  .small-link {
    font-size: 13px;
    color: #6b7280;
  }

  @media (max-width: 420px) {
    .login-card { width: 94%; padding: 20px; }
  }


</style>

<section class="login-page">
  <div class="login-card" role="region" aria-label="Login visual">
    <div class="brand">
      <img src="{{ url_for('static', filename='logo_small.png') }}"
      alt="Logo" width="110" height="110" onerror="this.style.display='none'">
    </div>
    <div class="header" style="margin-bottom: 24px; margin-top: 16px;">
      <p class="small-link" style="margin-bottom: 16px;">Acesse sua conta</p>
    </div>

    <form action="{{ url_for('login') }}" method="POST">
      <label for="usuario">Usuário</label>
      <input id="usuario" name="usuario" type="text" placeholder="ex: ana.souza" autocomplete="usuario">

      <label for="senha">Senha</label>
      <input id="senha" name="senha" type="password" placeholder="••••••••" autocomplete="current-password">

      <div class="actions">
        <button class="btn btn-primary" type="submit">Entrar</button>
      </div>
    </form>
  </div>
</section>
{% endblock %}
